<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>your little place of love</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap"><style id="css">
:root{--bg:#611826;--ink:#f6e9d7;--mute:#dcaaa5;--line:rgba(246,233,215,.25);--ink-on:#611826;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#460f1b;--ink:#f1e2cf;--mute:#cf9a95;--ink-on:#460f1b}}
:root[data-theme="dark"]{--bg:#460f1b;--ink:#f1e2cf;--mute:#cf9a95;--ink-on:#460f1b}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,"Times New Roman",serif;font-size:1.125rem;line-height:1.75}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1.5rem 4rem;animation:in .5s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){main{animation:none}}
a{color:inherit}
a:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:6px}
h1,h2{font-weight:400;line-height:1.2;margin:0}
p{margin:0 0 1.3em}
.bar{display:flex;justify-content:space-between;gap:1rem;font-size:.95rem;color:var(--mute);padding-bottom:2rem}
.bar a{text-decoration:none}
.bar a:hover{color:var(--ink)}
.btn{display:inline-block;margin-top:2rem;padding:.65rem 1.8rem;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;font-size:1.05rem;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--ink-on)}
.home{min-height:88svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-bottom:2.2rem}
.hero img{width:92px;height:auto}
.hero img:nth-child(1){transform:rotate(-9deg)}
.hero img:nth-child(2){width:118px;transform:rotate(3deg)}
.hero img:nth-child(3){transform:rotate(9deg)}
.home h1{font-size:clamp(2.2rem,9vw,3.1rem);font-style:italic}
.home .sub{color:var(--mute);margin:.9rem 0 0}
.pic{width:76px;height:auto;display:block;margin-bottom:1.4rem;transform:rotate(-6deg)}
h2{font-size:2rem;font-style:italic;margin-bottom:1.6rem}
.note-date{font-size:1.7rem;font-style:italic}
.note-title{color:var(--mute);margin:.3rem 0 2rem}
.list{list-style:none;margin:0;padding:0}
.list a{display:flex;align-items:center;gap:1rem;padding:.85rem 0;border-top:1px solid var(--line);text-decoration:none}
.list li:last-child a{border-bottom:1px solid var(--line)}
.list img{width:46px;height:auto;flex:none}
.list a:hover span{text-decoration:underline;text-underline-offset:5px}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.98rem;color:var(--mute)}
.pager a{text-decoration:none}
.pager a:hover{color:var(--ink)}
.empty{color:var(--mute)}

.bar span{display:flex;gap:1.2rem}
.fld{display:block;margin-bottom:1.3rem;color:var(--mute);font-size:.95rem}
.fld input,.fld textarea{display:block;width:100%;box-sizing:border-box;margin-top:.4rem;padding:.7rem .8rem;background:transparent;color:var(--ink);color-scheme:dark;border:1.5px solid var(--line);border-radius:12px;font:inherit;line-height:1.6}
.fld input:focus-visible,.fld textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.btn{margin:.5rem .6rem 0 0;background:transparent;color:var(--ink);font-family:inherit;font-size:1.05rem;cursor:pointer}
.ghost{border-color:var(--line);color:var(--mute)}
.ed{margin-top:2.2rem;font-size:.95rem}

i shouldn’t have done that. walaupun ini baru pertama kalinya aku bohong sama kamu, aku ngerti kenapa satu kebohongan ini bisa hit differently because it happened after all those other things. aku nggak mau bilang “kan baru sekali” terus berharap itu bikin semuanya jadi kecil. it doesn’t. i know what i did was wrong, and i’m genuinely sorry that i made you question my honesty and my words.\n\naku juga sorry karena mungkin selama ini aku terlalu sering mikir “ah ini kecil” atau “nanti juga aku kerjain” tanpa sadar kalau dari sisi kamu, yang kamu lihat bukan satu kejadian. kamu lihat a pattern. kamu lihat things happening again and again, dan aku bisa ngerti kenapa akhirnya kamu capek. i should’ve realized that sooner.\n\nand i don’t want to just say sorry and then do the exact same thing again. i really don’t. aku pengin mulai dari sekarang untuk actually do something different. bukan cuma ngomong “aku bakal berubah”, tapi aku mau lebih aware sama hal-hal yang selama ini aku ulang. kalau aku belum melakukan sesuatu, i’ll tell you i haven’t. kalau aku bilang akan melakukan sesuatu, aku akan actually follow through. kalau ada sesuatu yang aku nggak bisa lakukan sesuai yang aku bilang, i’ll tell you first instead of letting you find out or having to remind me.\n\naku juga udah mulai removing cowo-cowo dari second account aku because i want you to see that i’m not just sitting here saying sorry. i’m already taking actions where i can. bukan berarti aku berharap satu action itu langsung bikin semuanya okay. i know it doesn’t work like that. aku cuma mau kamu tahu that i’m taking this seriously and i’m not waiting until tomorrow to start doing better.\n\ndan kalau kamu sekarang nggak bisa percaya sama kata-kata aku, i understand. honestly, you don’t have to force yourself to. aku nggak mau bilang “please trust me” ketika aku tahu trust itu something i have to earn back through consistency. kalau sekarang words feel cheap to you, then let my actions speak instead.\n\naku juga nggak akan menyerah cuma karena sekarang lagi susah. i’m not going to look at one bad night and suddenly decide that you’re too much, that this relationship is too hard, or that it’s easier to walk away. no. i’m still here. i’m still choosing you.\n\naku tahu choosing you doesn’t mean ignoring what hurts you. it means being willing to sit with the uncomfortable parts too. kalau aku salah, aku mau dengar. kalau kamu kecewa, aku mau understand why. kalau ada bagian dari aku yang needs to change, i want to work on it. aku nggak mau cuma jadi pasangan yang ada ketika everything is cute and easy. i want to be someone who can stay when things get messy too.\n\nand please know this: you deserve so much love. you deserve to feel appreciated. you deserve to feel heard. you deserve to feel like the things you say actually matter to the person you love. you deserve someone who notices the little things, someone who doesn’t make you repeat yourself forever, someone who makes you feel valued instead of making you question whether you’re being taken seriously.\n\nand i want to become better at being that person for you.\n\naku nggak bilang aku bakal suddenly become perfect. i won’t. aku masih bisa salah, masih bisa lupa, masih bisa have bad days. tapi aku don’t want my mistakes to become an excuse for repeating the same hurt over and over again. kalau aku make a mistake, i want to learn from it. kalau aku repeat something, i want to actually stop and figure out why instead of just saying sorry again.\n\naku juga nggak mau kamu merasa kamu harus forgive me tonight. you don’t have to. kamu boleh masih marah. kamu boleh masih kecewa. kamu boleh butuh space. i’m not going to force you to suddenly be okay just because i apologized.\n\nbut even if you don’t want to talk to me tonight, i’m still here.\n\ni’m not disappearing. i’m not giving up. i’m not suddenly going to stop caring because this is uncomfortable. kalau kamu belum mau pick up my call, i’ll respect that. kalau nanti kamu ready, i’ll be here. kalau kamu cuma mau silent call, i’ll stay. kalau kamu butuh space, i’ll give it to you without making you feel like i’m abandoning you.\n\naku cuma mau kamu tahu that this difficult moment doesn’t change how much you mean to me.\n\nyou are still my person.\ni still love you.\ni still choose you.\nand i still believe that what we have is worth taking care of.\n\naku nggak mau membuktikan itu dengan words aja. i want you to see it in me.\n\nso i’m sorry, genuinely. for this, for the things i’ve repeated, for making you feel unheard, and for making you feel like you weren’t being valued the way you should be.\n\ni love you, and i’m still here. even when it’s hard. especially when it’s hard."}]</script><script id="main">const $ = id => document.getElementById(id);

const INTRO = "hello my love,\n\ni made this little place just for you.\n\nsomewhere you can come back to every day, because every day there will be something different waiting for you here. a little note, a reminder, a thought, a love letter, or simply a few words i want you to hear.\n\nsome days, i’ll remind you how loved you are. some days, how proud i am of you. some days, i’ll remind you of the things you might forget when life gets a little too loud.\n\ni wanted you to have a place that always feels like me reaching for you, even when i’m not right there beside you.\n\nso come back tomorrow, and the day after that, and whenever you need a little reminder from me.\n\nthis is your little place of love.\nand i’ll keep filling it with pieces of mine, one day at a time.";

/* the page rebuilds its own source from its parts, never from the live DOM */
function buildDoc(entries){
  return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>your little place of love</title><link rel="stylesheet" href="' + FONTS + '"><style id="css">' + $("css").textContent + '</style></head><body><main id="app"></main><script type="application/json" id="stickers">' + $("stickers").textContent + '<\/script><script type="application/json" id="data">' + JSON.stringify(entries).replace(/</g,"\\u003c") + '<\/script><script id="main">' + $("main").textContent + '<\/script></body></html>';
}
async function commit(next, goto){
  if (busy) return;
  busy = true; say("saving...");
  try { sessionStorage.setItem("goto", goto); } catch (_) {}
  try { await artifact.publish(buildDoc(next)); }
  catch (err) {
    busy = false;
    try { sessionStorage.removeItem("goto"); } catch (_) {}
    const c = err && err.code;
    if (c === "conflict") return;
    say(c === "not_writer" || c === "not_granted" || c === "consent_required" ? "this view is read-only." : c === "rate_limited" ? "please wait a moment and try again." : "could not save. please try again.");
  }
}
function editor(arg){
  const ex = ENTRIES.find(e => e.date === arg);
  const e = ex || { date: today(), title: "", body: "" };
  return bar() + "<h2>" + (ex ? "edit note" : "new note") + "</h2>" +
    '<label class="fld">date<input id="f-date" type="date" value="' + e.date + '"></label>' +
    '<label class="fld">title (optional)<input id="f-title" type="text" value="' + esc(e.title || "") + '"></label>' +
    '<label class="fld">note<textarea id="f-body" rows="14">' + esc(e.body) + "</textarea></label>" +
    '<p id="msg" class="empty" role="status"></p>' +
    '<button class="btn" id="save">save note</button>' + (ex ? '<button class="btn ghost" id="del">delete</button>' : "");
}
function wire(arg){
  $("save").onclick = () => {
    const date = $("f-date").value, title = $("f-title").value.trim(), body = $("f-body").value.trim();
    if (!date || !body) return say("please fill in the date and the note.");
    if (date !== arg && ENTRIES.some(x => x.date === date)) return say("there is already a note on that date.");
    const next = ENTRIES.filter(x => x.date !== arg);
    next.push({ date, title, body });
    commit(next, "#/note/" + date);
  };
  const del = $("del");
  if (del) del.onclick = () => {
    if (!armed) { armed = true; del.textContent = "tap again to delete"; return; }
    commit(ENTRIES.filter(x => x.date !== arg), "#/notes");
  };
}
function render(){
  const [route, arg] = location.hash.replace(/^#\/?/, "").split("/");
  const desc = list();
  let html = "";
  armed = false;
  document.title = "your little place of love";
  if (route === "intro") {
    html = bar() + '<img class="pic" src="' + S[5] + '" alt="">' + "<h2>introduction</h2>" + paras(INTRO) + '<a class="btn" href="#/notes">read the notes</a>';
  } else if (route === "notes") {
    html = bar() + "<h2>notes</h2>" + (desc.length
      ? '<ul class="list">' + desc.map(e => '<li><a href="#/note/' + e.date + '"><img src="' + e.s + '" alt=""><span>' + fmt(e.date) + "</span></a></li>").join("") + "</ul>"
      : '<p class="empty">the first note is on its way.</p>') + (canEdit ? '<a class="btn" href="#/edit/new">new note</a>' : "");
  } else if (route === "note" && desc.some(e => e.date === arg)) {
    const i = desc.findIndex(e => e.date === arg), e = desc[i], newer = desc[i-1], older = desc[i+1];
    document.title = fmt(e.date) + " · your little place of love";
    html = bar() + '<img class="pic" src="' + e.s + '" alt="">' + '<h1 class="note-date">' + fmt(e.date) + "</h1>" +
      (e.title ? '<p class="note-title">' + esc(e.title) + "</p>" : '<div style="height:1.6rem"></div>') + paras(e.body) +
      (canEdit ? '<p class="ed"><a href="#/edit/' + e.date + '">edit this note</a></p>' : "") +
      '<div class="pager"><span>' + (older ? '<a href="#/note/' + older.date + '">older note</a>' : "") + '</span><a href="#/notes">all notes</a><span>' + (newer ? '<a href="#/note/' + newer.date + '">newer note</a>' : "") + "</span></div>";
  } else if (route === "edit" && canEdit) {
    html = editor(arg);
  } else {
    html = '<div class="home"><div class="hero"><img src="' + S[2] + '" alt=""><img src="' + S[4] + '" alt=""><img src="' + S[0] + '" alt=""></div><h1>your little place of love</h1><p class="sub">a little note for you, every day.</p><a class="btn" href="#/intro">come in</a></div>';
  }
  app.innerHTML = html;
  app.style.animation = "none"; void app.offsetWidth; app.style.animation = "";
  window.scrollTo(0, 0);
  if (route === "edit" && canEdit) wire(arg);
}
try { const g = sessionStorage.getItem("goto"); if (g) { sessionStorage.removeItem("goto"); location.hash = g; } } catch (_) {}
addEventListener("hashchange", render);
render();
(async () => {
  try {
    const u = await claude.use("user");
    artifact = await claude.use("artifact");
    canEdit = !!(u && artifact && await u.canEdit());
    if (canEdit) render();
  } catch (_) {}
})();
</script></body></html>
